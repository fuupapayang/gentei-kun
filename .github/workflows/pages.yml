name: Deploy front-end to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - name: Build static site (dist/)
        env:
          # Repository variables: FIREBASE_CONFIG (JSON of the web app config), ADMIN_EMAILS (comma separated)
          FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$FIREBASE_CONFIG" ]; then echo "::error::Repository variable FIREBASE_CONFIG is not set"; exit 1; fi
          # <owner>.github.io repos are served from "/", every other repo from "/<repo>/"
          if [ "${REPO_NAME,,}" = "${OWNER,,}.github.io" ]; then BASE="/"; else BASE="/${REPO_NAME}/"; fi
          node scripts/build-pages.js --mode firebase --base "$BASE" ${{ vars.ALLOW_INDEX == '1' && '--index' || '' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
