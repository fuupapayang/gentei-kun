<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="限定くん">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
<title>ホーム画面に追加｜限定くん</title>
</head>
<body data-page="install">
<div class="page">
  <div class="page-head">
    <a class="logo" href="./"><img class="escon-logo inv" src="assets/img/common_escon.svg" alt="ES CON エスコン"><small>限定くん｜<span class="pname">グランレ・ジェイド葉山</span></small></a>
    <h1>ホーム画面に追加</h1>
    <p>アプリのように、いつでも限定情報をご覧いただけます</p>
  </div>
  <div class="wrap">
    <div class="card">
      <div class="center"><span class="pill">約30秒</span>
        <h2 class="serif" style="margin:12px 0 4px;font-size:19px;letter-spacing:.08em"><span id="who"></span>あと少しで完了です</h2>
        <p class="note" style="margin:0">お使いの環境：<b id="envLabel" style="color:var(--blue)">-</b></p>
      </div>
      <div class="env-tabs" id="tabs">
        <button data-env="ios">iPhone</button><button data-env="android">Android</button><button data-env="pc">パソコン</button>
      </div>
      <div class="alert" id="envAlert"></div>
      <div class="sum-line" id="sumLine"></div>
      <button class="btn btn-red btn-block install-btn" id="installBtn" hidden>ワンタップでホーム画面に追加</button>
      <div id="steps"></div>
      <div class="done-card" id="doneCard" hidden><b>インストール済みです</b><p style="margin:6px 0 12px;font-size:12px;opacity:.85">ホーム画面のアイコンから起動してください。</p><a class="btn btn-red btn-sm" href="./">TOPへ</a></div>
    </div>
    <p class="center note" style="margin-bottom:34px"><a href="./">公式サイトに戻る</a></p>
  </div>
  <div class="foot-light"><img class="escon-logo" src="assets/img/common_escon.svg" alt="ES CON エスコン"><div class="prov">提供 株式会社エスコン</div></div>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
